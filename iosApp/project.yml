# Generate the Xcode project with: brew install xcodegen && xcodegen (run inside iosApp/)
name: iosApp
options:
  bundleIdPrefix: com.weatherwise
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    settings:
      base:
        PRODUCT_NAME: WeatherWise
        PRODUCT_BUNDLE_IDENTIFIER: com.weatherwise.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: WeatherWise
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iosAppTests]
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # The app's product name is WeatherWise, not the target name, so point the tests at it explicitly.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WeatherWise.app/WeatherWise"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppTests: [test]
    test:
      targets: [iosAppTests]
